name: Neue Repositories prüfen

# Meldet öffentliche Wilkware-Repositories, die noch keinen Eintrag unter content/ haben
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare repositories with content
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = 'Wilkware';
            const title = 'Neue Repositories ohne Eintrag auf der Projektseite';

            const ignoreFile = '.github/repo-ignore.txt';
            const ignored = fs.existsSync(ignoreFile)
              ? fs.readFileSync(ignoreFile, 'utf8').split(/\r?\n/).map((l) => l.trim().toLowerCase()).filter((l) => l && !l.startsWith('#'))
              : [];

            const listed = new Set();
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).forEach((e) => {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) return walk(p);
              const m = fs.readFileSync(p, 'utf8').match(/^link:\s*https:\/\/github\.com\/[^/]+\/(\S+)/m);
              if (m) listed.add(m[1].toLowerCase());
            });
            walk('content');

            const repos = await github.paginate(github.rest.repos.listForUser, { username: owner, type: 'owner', per_page: 100 });
            const missing = repos
              .filter((r) => !r.fork && !r.archived && !r.private && r.size > 0)
              .filter((r) => !listed.has(r.name.toLowerCase()) && !ignored.includes(r.name.toLowerCase()))
              .sort((a, b) => a.created_at.localeCompare(b.created_at));

            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = issues.find((i) => i.title === title && !i.pull_request);

            if (missing.length === 0) {
              core.info('Alle Repositories sind eingetragen.');
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: 'Alle Repositories sind jetzt eingetragen.' });
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' });
              }
              return;
            }

            const body = [
              'Folgende öffentliche Repositories haben noch keinen Eintrag unter `content/`:',
              '',
              ...missing.map((r) => `- [ ] [${r.name}](${r.html_url}) – ${r.language ?? 'ohne Sprache'}, angelegt ${r.created_at.slice(0, 10)}${r.description ? ` – ${r.description}` : ''}`),
              '',
              `Repositories, die bewusst nicht erscheinen sollen, in \`${ignoreFile}\` eintragen.`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
            core.info(`${missing.length} fehlende(s) Repository/Repositories gemeldet.`);
